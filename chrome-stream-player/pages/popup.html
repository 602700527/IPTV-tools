<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPTV Test Play</title>
  <link rel="stylesheet" href="../css/popup.css">
</head>
<body>
  <div class="app">
    <div class="menu-header">
      <div class="menu-brand">
        <div class="menu-brand-icon">▶</div>
        <div>
          <div class="menu-brand-name">IPTV Test Play</div>
          <div class="menu-brand-sub">One-click stream player</div>
        </div>
      </div>
    </div>

    <button id="openPlayerBtn" class="menu-action menu-action-primary">
      <span class="menu-action-icon">🎬</span>
      <span class="menu-action-text">Open Player</span>
      <span class="menu-action-hint">full player + history</span>
    </button>

    <a id="openSiteLink" class="menu-action menu-action-secondary" href="https://iptv-search.com" target="_blank">
      <span class="menu-action-icon">🌐</span>
      <span class="menu-action-text">Open iptv-search.com</span>
      <span class="menu-action-hint">browse channels</span>
    </a>

    <div class="menu-tip">
      Tip: open any channel page, click <strong>Test Play</strong> — the player opens here automatically.
    </div>

    <div class="menu-footer">
      <span>v1.1.0</span>
      <span class="menu-footer-sep">·</span>
      <a href="https://iptv-search.com/tutorial#browser-extension" target="_blank">Tutorial</a>
    </div>
  </div>

  <script src="../js/popup.js"></script>
</body>
</html>
