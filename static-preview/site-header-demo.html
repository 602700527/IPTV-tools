<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Header Demo | IPTV Search</title>
  <style>
    
  /* CSS 变量定义 */
  :root {
    --bg-primary: #0a0a0a;
    --bg-secondary: #141414;
    --bg-card: #1a1a1a;
    --bg-hover: #252525;
    --text-primary: #ffffff;
    --text-secondary: #a0a0a0;
    --text-muted: #666666;
    --accent: #e50914;
    --accent-hover: #f6121d;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.15);
    --shadow: 0 4px 20px rgba(0,0,0,0.5);
    --radius: 8px;
    --transition: 0.2s ease;
  }

  [data-theme="light"] {
    --bg-primary: #f5f5f5;
    --bg-secondary: #ffffff;
    --bg-card: #ffffff;
    --bg-hover: #f0f0f0;
    --text-primary: #1a1a1a;
    --text-secondary: #666666;
    --text-muted: #999999;
    --border: rgba(0,0,0,0.08);
    --border-hover: rgba(0,0,0,0.15);
    --shadow: 0 4px 20px rgba(0,0,0,0.1);
  }

  /* 基础重置 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    background: var(--bg-primary); 
    color: var(--text-primary); 
    line-height: 1.6; 
  }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }
  button { cursor: pointer; font-family: inherit; }

  /* 页头样式 */
  .site-header { 
    background: var(--bg-secondary); 
    border-bottom: 1px solid var(--border); 
    padding: 1rem 2rem; 
    position: sticky; 
    top: 0; 
    z-index: 100; 
  }
  .site-header .header-inner { 
    max-width: 1400px; 
    margin: 0 auto; 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    gap: 1.5rem; 
  }
  
  /* Logo */
  .site-header .logo { 
    display: flex; 
    align-items: center; 
    gap: 0.75rem; 
    font-size: 1.5rem; 
    font-weight: 700; 
    flex-shrink: 0; 
  }
  .site-header .logo-icon svg { 
    width: 36px; 
    height: 36px; 
  }
  .site-header .logo-text span { 
    color: var(--accent); 
  }
  
  /* 搜索框 */
  .site-header .search-box { 
    position: relative; 
    width: 300px; 
  }
  .site-header .search-box form { 
    display: flex; 
  }
  .site-header .search-box input {
    width: 100%; 
    padding: 0.6rem 1rem 0.6rem 2.5rem; 
    background: var(--bg-card); 
    border: 1px solid var(--border);
    border-radius: 20px; 
    color: var(--text-primary); 
    font-size: 0.9rem; 
    outline: none; 
    transition: border-color var(--transition);
  }
  .site-header .search-box input:focus { 
    border-color: var(--accent); 
  }
  .site-header .search-box::before {
    content: '🔍'; 
    position: absolute; 
    left: 0.75rem; 
    top: 50%; 
    transform: translateY(-50%);
    font-size: 0.9rem; 
    pointer-events: none;
  }
  .site-header .search-box-placeholder {
    flex: 1;
    max-width: 300px;
  }
  
  /* 头部操作按钮 */
  .site-header .header-actions { 
    display: flex; 
    align-items: center; 
    gap: 1rem; 
  }
  
  /* 胶囊按钮 */
  .site-header .pill-btn { 
    display: inline-flex; 
    align-items: center; 
    justify-content: center; 
    width: 36px; 
    height: 36px; 
    color: var(--text-secondary); 
    text-decoration: none; 
    transition: color var(--transition);
    border-radius: 8px;
  }
  .site-header .pill-btn:hover { 
    color: var(--accent); 
    background: var(--bg-hover);
  }
  .site-header .pill-btn.active {
    color: var(--accent);
    background: rgba(229, 9, 20, 0.1);
  }
  
  /* 账户按钮 */
  .site-header .account-btn { 
    display: inline-flex; 
    align-items: center; 
    justify-content: center; 
    width: 36px; 
    height: 36px; 
    color: var(--text-secondary); 
    text-decoration: none; 
    transition: all var(--transition);
    border-radius: 8px;
  }
  .site-header .account-btn:hover { 
    color: var(--accent); 
    background: var(--bg-hover);
  }
  .site-header .account-btn.active {
    color: var(--accent);
    background: rgba(229, 9, 20, 0.1);
  }
  .site-header .account-btn svg, 
  .site-header .pill-btn svg { 
    width: 18px; 
    height: 18px; 
    flex-shrink: 0; 
  }
  
  /* 主题切换按钮 */
  .site-header .theme-toggle { 
    width: 36px; 
    height: 36px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    background: transparent; 
    color: var(--text-secondary); 
    cursor: pointer; 
    transition: all var(--transition); 
    border: none;
    border-radius: 8px;
  }
  .site-header .theme-toggle:hover { 
    color: var(--accent); 
    background: var(--bg-hover);
  }
  
  /* 语言切换器 */
  .site-header #translate { 
    position: relative; 
    display: inline-flex; 
    align-items: center; 
  }
  .site-header #translateSelectLanguage { 
    appearance: none; 
    -webkit-appearance: none; 
    padding: 0.5rem 2rem 0.5rem 0.75rem; 
    background: transparent; 
    border: none; 
    border-radius: 6px; 
    color: var(--text-secondary); 
    font-size: 0.85rem; 
    cursor: pointer; 
    outline: none; 
    transition: color var(--transition); 
    min-width: 80px; 
  }
  .site-header #translateSelectLanguage:focus { 
    color: var(--accent); 
  }
  .site-header #translateSelectLanguage:hover { 
    color: var(--accent); 
  }
  .site-header #translate::after { 
    content: ""; 
    position: absolute; 
    right: 0.6rem; 
    top: 50%; 
    transform: translateY(-50%); 
    border-left: 4px solid transparent; 
    border-right: 4px solid transparent; 
    border-top: 5px solid var(--text-secondary); 
    pointer-events: none; 
  }
  .site-header #translate:hover::after { 
    border-top-color: var(--accent); 
  }

  /* 移动端适配 */
  @media (max-width: 768px) {
    .site-header { 
      padding: 0.5rem 0.75rem; 
    }
    .site-header .header-inner { 
      flex-wrap: wrap; 
      justify-content: space-between; 
      gap: 0.5rem; 
    }
    .site-header .logo { 
      flex-shrink: 0; 
    }
    .site-header .logo-icon svg { 
      width: 32px; 
      height: 32px; 
    }
    .site-header .logo-text { 
      display: none; 
    }
    .site-header .search-box { 
      width: 100%; 
      order: 3; 
      margin-top: 0.5rem; 
    }
    .site-header .search-box input { 
      padding: 0.5rem 1rem 0.5rem 2.5rem; 
      font-size: 0.9rem; 
    }
    .site-header .search-box::before { 
      font-size: 0.9rem; 
      left: 0.8rem; 
    }
    .site-header .header-actions { 
      gap: 0.25rem; 
      flex-shrink: 0; 
    }
    .site-header .header-actions .pill-btn { 
      width: 32px; 
      height: 32px; 
      padding: 0; 
      flex-shrink: 0; 
    }
    .site-header .theme-toggle { 
      width: 32px; 
      height: 32px; 
      background: transparent; 
      border: none; 
      padding: 0; 
      flex-shrink: 0; 
    }
    .site-header .account-btn { 
      width: 32px; 
      height: 32px; 
      padding: 0; 
      flex-shrink: 0; 
    }
  }

    
    /* Demo 页面样式 */
    .demo-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
      text-align: center;
    }
    .demo-content h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .demo-content p {
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  
  <header class="site-header">
    <div class="header-inner">
      <a href="https://iptv-search.com/" class="logo">
        <div class="logo-icon">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="tvGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#e50914;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#ff3b30;stop-opacity:1" />
              </linearGradient>
            </defs>
            <rect x="0" y="0" width="36" height="36" rx="6" fill="url(#tvGradient)" />
            <rect x="4" y="8" width="28" height="18" rx="2" fill="#0a0a0a" />
            <path d="M14 12 L24 17 L14 22 Z" fill="#fff" />
            <rect x="10" y="28" width="6" height="3" rx="1" fill="#0a0a0a" />
            <rect x="20" y="28" width="6" height="3" rx="1" fill="#0a0a0a" />
          </svg>
        </div>
        <div class="logo-text">IPTV<span>Search</span></div>
      </a>
      
      <div class="search-box">
        <form action="https://iptv-search.com/search" method="get">
          <input type="text" name="q" placeholder="Search channels..." value="">
        </form>
      </div>
      
      <div class="header-actions">
        <a href="https://iptv-search.com/favorites" class="pill-btn active" title="My Favorites">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        </a>
        <a href="https://iptv-search.com/plans" class="pill-btn " title="Subscription Plans">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        </a>
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
        <a href="https://iptv-search.com/account" class="account-btn " title="My Account">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </a>
        <div id="translate"></div>
      </div>
    </div>
  </header>
  
  
  <main class="demo-content">
    <h1>Site Header Component Demo</h1>
    <p>This is a demo page showing the unified site header component.</p>
    <p>Try switching themes, navigating, and resizing the window.</p>
  </main>
  
  <script>
    
  // Theme toggle
  document.getElementById('themeToggle')?.addEventListener('click', function() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });

  </script>
</body>
</html>
