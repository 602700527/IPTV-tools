<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account - IPTV Search</title>
  <meta name="description" content="Manage your IPTV Search account, view subscription status and order history.">
  <link rel="canonical" href="https://iptv-search.com/account">
  
  <!-- Theme detection to prevent flash -->
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  
  <style>
    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #141414;
      --bg-card: #1a1a1a;
      --bg-hover: #252525;
      --text-primary: #ffffff;
      --text-secondary: #a0a0a0;
      --text-muted: #666666;
      --accent: #e50914;
      --accent-hover: #f6121d;
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.15);
      --shadow: 0 4px 20px rgba(0,0,0,0.5);
      --radius: 12px;
      --transition: 0.2s ease;
    }

    [data-theme="light"] {
      --bg-primary: #f5f5f5;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --bg-hover: #f0f0f0;
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --text-muted: #999999;
      --border: rgba(0,0,0,0.08);
      --border-hover: rgba(0,0,0,0.15);
      --shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    button { cursor: pointer; font-family: inherit; }

    /* Header */
    .header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.5rem;
      font-weight: 700;
    }
    .logo-icon svg { width: 36px; height: 36px; }
    .logo-text span { color: var(--accent); }

    /* Pill Button */
    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-primary);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
    }

    .pill-btn:hover {
      background: var(--bg-hover);
      border-color: var(--border-hover);
    }

    .pill-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem;
    }

    .account-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 800px;
      box-shadow: var(--shadow);
    }

    .account-header {
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .account-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .account-header p {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    /* Tab Buttons */
    .tab-buttons {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .tab-btn {
      padding: 0.75rem 1.5rem;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-weight: 500;
      transition: all var(--transition);
    }

    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .tab-btn:hover:not(.active) {
      background: var(--bg-hover);
    }

    /* Tab Content */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* User Info */
    .user-info-card {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .info-value {
      font-weight: 500;
      font-size: 0.95rem;
    }

    .info-value.highlight {
      color: var(--accent);
    }

    /* Subscription Status */
    .subscription-status {
      margin-top: 1.5rem;
      padding: 1rem;
      background: rgba(229, 9, 20, 0.1);
      border: 1px solid rgba(229, 9, 20, 0.3);
      border-radius: var(--radius);
    }

    .subscription-status h3 {
      font-size: 1rem;
      margin-bottom: 0.5rem;
      color: var(--accent);
    }

    .subscription-status p {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    /* Orders */
    .orders-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .order-card {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.5rem;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .order-id {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .order-date {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .order-details {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .order-type {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .order-status {
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .order-status.active {
      background: rgba(52, 199, 89, 0.2);
      color: #34c759;
    }

    .order-status.expired {
      background: rgba(255, 59, 48, 0.2);
      color: #ff3b30;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-secondary);
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    .empty-state h3 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

    .empty-state p {
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    /* Logout Button */
    .logout-btn {
      width: 100%;
      padding: 1rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-size: 1rem;
      font-weight: 500;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 2rem;
    }

    .logout-btn:hover {
      background: rgba(255, 59, 48, 0.1);
      border-color: #ff3b30;
      color: #ff3b30;
    }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.5rem;
      font-size: 0.9rem;
      font-weight: 500;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
    }

    .toast.success {
      border-color: #34c759;
      color: #34c759;
    }

    .toast.error {
      border-color: #ff3b30;
      color: #ff3b30;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .header { padding: 0.75rem 1rem; }
      .header-inner { 
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }
      .logo { font-size: 1.2rem; }

      .main { padding: 1rem; }
      .account-container { padding: 1.5rem; }
      .account-header h1 { font-size: 1.5rem; }
      .tab-buttons { gap: 0.375rem; }
      .tab-btn { padding: 0.625rem 1rem; font-size: 0.85rem; }
    }
    
    /* ==================== MOBILE RESPONSIVE ==================== */
    @media (max-width: 768px) {
      /* Header */
      .header { padding: 0.75rem 1rem; }
      .header-inner { flex-wrap: wrap; gap: 0.75rem; }
      .header-actions { gap: 0.4rem; }
      .icon-btn { padding: 0.5rem 0.75rem; }
      .icon-btn span { display: none; }
      .icon-btn svg { width: 18px; height: 18px; }
      .theme-toggle { padding: 0.5rem 0.75rem; }
      .theme-toggle svg { width: 18px; height: 18px; }
      
      /* Account Header */
      .account-header { padding: 1.5rem 1rem 0; flex-direction: column; align-items: center; text-align: center; gap: 1rem; }
      .user-info h1 { font-size: 1.5rem; }
      .user-email { font-size: 0.85rem; }
      .user-stats { flex-wrap: wrap; justify-content: center; gap: 1rem; }
      .stat-item { min-width: 80px; }
      .stat-value { font-size: 1.25rem; }
      .stat-label { font-size: 0.75rem; }
      .logout-btn { padding: 0.5rem 1rem; font-size: 0.85rem; }
      
      /* Account Nav */
      .account-nav { padding: 1rem; gap: 0.5rem; overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .nav-tab { padding: 0.5rem 1rem; font-size: 0.85rem; white-space: nowrap; }
      
      /* Account Content */
      .account-content { padding: 1rem; }
      .account-section { padding: 1.5rem; margin-bottom: 1rem; }
      .account-section h2 { font-size: 1.1rem; margin-bottom: 1rem; }
      .info-grid { grid-template-columns: 1fr; gap: 0.75rem; }
      .info-item { padding: 0.75rem; }
      .info-label { font-size: 0.8rem; }
      .info-value { font-size: 0.9rem; }
      
      /* Order Items */
      .order-item { flex-direction: column; gap: 0.75rem; padding: 1rem; }
      .order-details { width: 100%; }
      .order-status { align-self: flex-start; }
      .order-actions { width: 100%; justify-content: flex-end; }
      
      /* Buttons */
      .btn { padding: 0.6rem 1rem; font-size: 0.85rem; }
      .btn-sm { padding: 0.4rem 0.75rem; font-size: 0.8rem; }
      
      /* Footer */
      .page-footer { padding: 1.5rem 1rem; }
      .footer-content { padding: 0 0.5rem; }
      .footer-links { font-size: 0.7rem; gap: 0.75rem; flex-wrap: wrap; justify-content: center; }
    }

    @media (max-width: 480px) {
      .account-header h1 { font-size: 1.25rem; }
      .info-row { flex-direction: column; align-items: flex-start; gap: 0.25rem; }
      .order-header { flex-direction: column; align-items: flex-start; gap: 0.25rem; }
      .user-stats { gap: 0.75rem; }
      .stat-item { min-width: 70px; }
      .account-section { padding: 1rem; }
      .page-footer { padding: 1rem 0.75rem; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 36 36" fill="none">
            <defs>
              <linearGradient id="tvGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#e50914" />
                <stop offset="100%" style="stop-color:#ff3b30" />
              </linearGradient>
            </defs>
            <rect x="0" y="0" width="36" height="36" rx="6" fill="url(#tvGradient)" />
            <rect x="4" y="8" width="28" height="18" rx="2" fill="#0a0a0a" />
            <path d="M14 12 L24 17 L14 22 Z" fill="#fff" />
            <rect x="10" y="28" width="6" height="3" rx="1" fill="#0a0a0a" />
            <rect x="20" y="28" width="6" height="3" rx="1" fill="#0a0a0a" />
          </svg>
        </div>
        <div class="logo-text">IPTV<span>Search</span></div>
      </a>
      
      <button class="pill-btn" id="themeToggle" title="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <span>Theme</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <div class="account-container">
      <div class="account-header">
        <h1>My Account</h1>
        <p>Manage your account settings and view subscription information</p>
      </div>

      <!-- Tab Buttons -->
      <div class="tab-buttons">
        <button class="tab-btn active" id="infoTabBtn" onclick="switchTab('info')">Account Info</button>
        <button class="tab-btn" id="ordersTabBtn" onclick="switchTab('orders')">Orders</button>
      </div>

      <!-- Account Info Tab -->
      <div class="tab-content active" id="infoTab">
        <div class="loading" id="infoLoading">
          <div class="spinner"></div>
        </div>
        <div class="user-info-card" id="userInfoCard" style="display: none;">
          <div class="info-row">
            <span class="info-label">Email</span>
            <span class="info-value" id="userEmail">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">Member Since</span>
            <span class="info-value" id="userCreated">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">Subscription</span>
            <span class="info-value highlight" id="userSubscription">Active</span>
          </div>
        </div>
        <div class="empty-state" id="infoEmpty" style="display: none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <h3>Not Logged In</h3>
          <p>Please login to view your account information</p>
          <a href="/login" class="pill-btn" style="display: inline-flex; background: var(--accent); border-color: var(--accent); color: white;">
            Login
          </a>
        </div>
      </div>

      <!-- Orders Tab -->
      <div class="tab-content" id="ordersTab">
        <div class="loading" id="ordersLoading">
          <div class="spinner"></div>
        </div>
        <div class="orders-list" id="ordersList" style="display: none;"></div>
        <div class="empty-state" id="ordersEmpty" style="display: none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
          <h3>No Orders Yet</h3>
          <p>You haven't made any purchases yet</p>
          <a href="/plans" class="pill-btn" style="display: inline-flex; background: var(--accent); border-color: var(--accent); color: white;">
            View Plans
          </a>
        </div>
      </div>

      <!-- Logout Button -->
      <button class="logout-btn" id="logoutBtn" onclick="handleLogout()" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Logout
      </button>
    </div>
  </main>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    const sunSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
    const moonSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

    themeToggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      themeToggle.innerHTML = next === 'dark' ? moonSVG : sunSVG;
    });

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    themeToggle.innerHTML = savedTheme === 'dark' ? moonSVG : sunSVG;

    // Tab switching
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      document.getElementById(tab + 'TabBtn').classList.add('active');
      document.getElementById(tab + 'Tab').classList.add('active');
    }

    // Toast
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast ' + type + ' show';
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Check auth and load data
    async function loadUserData() {
      const token = localStorage.getItem('auth_token');
      const infoLoading = document.getElementById('infoLoading');
      const userInfoCard = document.getElementById('userInfoCard');
      const infoEmpty = document.getElementById('infoEmpty');
      const logoutBtn = document.getElementById('logoutBtn');

      if (!token) {
        infoLoading.style.display = 'none';
        infoEmpty.style.display = 'block';
        return;
      }

      try {
        const res = await fetch('/api/auth/user', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();

        infoLoading.style.display = 'none';

        if (data.success) {
          document.getElementById('userEmail').textContent = data.user.email;
          document.getElementById('userCreated').textContent = new Date(data.user.created_at).toLocaleDateString();
          document.getElementById('userSubscription').textContent = data.user.is_verified ? 'Active' : 'Not Verified';
          userInfoCard.style.display = 'block';
          logoutBtn.style.display = 'flex';
          loadOrders(token);
        } else {
          infoEmpty.style.display = 'block';
          logoutBtn.style.display = 'none';
        }
      } catch (e) {
        infoLoading.style.display = 'none';
        infoEmpty.style.display = 'block';
      }
    }

    async function loadOrders(token) {
      const ordersLoading = document.getElementById('ordersLoading');
      const ordersList = document.getElementById('ordersList');
      const ordersEmpty = document.getElementById('ordersEmpty');

      try {
        const res = await fetch('/api/auth/orders', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();

        ordersLoading.style.display = 'none';

        if (data.success && data.orders.length > 0) {
          ordersList.innerHTML = data.orders.map(order => `
            <div class="order-card">
              <div class="order-header">
                <span class="order-id">Order #${order.order_id}</span>
                <span class="order-date">${new Date(order.created_at).toLocaleDateString()}</span>
              </div>
              <div class="order-details">
                <span class="order-type">${order.duration_days} days subscription</span>
                <span class="order-status ${order.status}">${order.status}</span>
              </div>
            </div>
          `).join('');
          ordersList.style.display = 'flex';
        } else {
          ordersEmpty.style.display = 'block';
        }
      } catch (e) {
        ordersLoading.style.display = 'none';
        ordersEmpty.style.display = 'block';
      }
    }

    function handleLogout() {
      localStorage.removeItem('auth_token');
      showToast('Logged out successfully');
      setTimeout(() => window.location.href = '/', 1000);
    }

    // Initialize
    loadUserData();
  </script>

  <script src="https://cdn.jsdelivr.net/gh/xnx3/translate@4.0.0/translate.js/translate.js"></script>
  <script>
    function initTranslate() {
      if (typeof translate !== 'undefined' && translate.language) {
        translate.selectLanguageTag.show = true;
        translate.selectLanguageTag.documentId = 'translate';
        translate.language.setLocal('english');
        translate.service.use('client.edge');
        translate.listener.start();
        translate.setAutoDiscriminateLocalLanguage();
        translate.execute();
      } else {
        setTimeout(initTranslate, 100);
      }
    }
    initTranslate();
  </script>
</body>
</html>
