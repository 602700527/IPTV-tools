<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google OAuth Callback</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .container {
      text-align: center;
      padding: 40px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
     	animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 24px;
      font-weight: 600;
    }
    p {
      margin: 0;
      opacity: 0.9;
      font-size: 16px;
    }
    .error {
      color: #ff6b6b;
      background: rgba(255, 107, 107, 0.2);
      padding: 16px;
      border-radius: 8px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h2 id="status">正在处理登录...</h2>
    <p id="message">请稍候，我们正在验证您的Google账号</p>
  </div>

  <script>
    // 获取URL参数
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const state = urlParams.get('state');
    const error = urlParams.get('error');

    if (error) {
      document.getElementById('status').textContent = '登录失败';
      document.getElementById('message').innerHTML = `<div class="error">${error}</div>`;
    } else if (!code || !state) {
      document.getElementById('status').textContent = '参数错误';
      document.getElementById('message').innerHTML = '<div class="error">缺少必要的参数</div>';
    } else {
      // 发送到回调API
      const callbackUrl = `/api/auth/google/callback?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state)}`;

      fetch(callbackUrl)
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            document.getElementById('status').textContent = '登录成功！';
            document.getElementById('message').textContent = '正在返回...';

            // 发送消息到父窗口
            if (window.opener) {
              window.opener.postMessage({
                type: 'google_oauth_success',
                token: data.token,
                user: data.user
              }, window.location.origin);
            }

            // 2秒后关闭窗口
            setTimeout(() => {
              window.close();
            }, 2000);
          } else {
            document.getElementById('status').textContent = '登录失败';
            document.getElementById('message').innerHTML = `<div class="error">${data.error || '未知错误'}</div>`;
            
            if (window.opener) {
              window.opener.postMessage({
                type: 'google_oauth_error',
                error: data.error || '未知错误'
              }, window.location.origin);
            }
          }
        })
        .catch(err => {
          document.getElementById('status').textContent = '网络错误';
          document.getElementById('message').innerHTML = `<div class="error">${err.message}</div>`;
          
          if (window.opener) {
            window.opener.postMessage({
              type: 'google_oauth_error',
              error: err.message
            }, window.location.origin);
          }
        });
    }
  </script>
</body>
</html>
