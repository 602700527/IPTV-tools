name = "cf-tv-service"
main = "worker.js"
compatibility_date = "2023-05-18"

# KV 命名空间
[[kv_namespaces]]
binding = "KV"
id = "d5e943d023d0474382b04b3c15c47ffb"
preview_id = "d5e943d023d0474382b04b3c15c47ffb"

# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "tv-service-db"
database_id = "9c7c22f1-fa0e-48da-8874-19731483c550"

# 环境变量
[vars]
# 在生产环境中应该设置为安全值
ADMIN_KEY = "admin-key-please-change-in-production"
# 时区设置（东八区）
TIMEZONE = "Asia/Shanghai"

# 定时触发器 (用于自动同步启用的数据源)
# Cron表达式格式: 分 时 日 月 周
# 示例: "0 2 * * *" 表示每天凌晨2点执行
# "*/30 * * * *" 表示每30分钟执行一次
[triggers]
crons = ["0 10 * * *"]  # 每天凌晨2点自动同步所有启用的源
