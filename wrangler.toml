name = "cf-tv-service"
main = "worker.js"
compatibility_date = "2023-05-18"

# =====================================================
# 本地开发环境（wrangler dev 默认使用）
# KV / D1 用占位 ID，wrangler dev 会自动创建本地模拟器
# =====================================================

# 本地 KV 命名空间（占位 ID，本地模式自动建模拟器）
[[kv_namespaces]]
binding = "KV"
id = "local-kv-placeholder"
preview_id = "local-kv-placeholder"

# 本地 D1 数据库（占位 ID，本地模式自动建 SQLite）
[[d1_databases]]
binding = "DB"
database_name = "tv-service-db"
database_id = "local-d1-placeholder"

# Workers AI
[ai]
binding = "AI"

# 环境变量
[vars]
ADMIN_KEY = "admin-key-please-change-in-production"
TIMEZONE = "Asia/Shanghai"
RESEND_API_KEY = "re_SV65wtWn_6zDFiwGvPFRRv3gbcLDACDKe"
FROM_EMAIL = "support@iptv-search.com"
APP_URL = "https://iptv-search.com"
XUNHUPAY_ALIPAY_APP_ID = "202303140161"
XUNHUPAY_ALIPAY_APP_SECRET = "9265ede6d1d85a9ecb7cbf2b97ca0cbd"
XUNHUPAY_WECHAT_APP_ID = ""
XUNHUPAY_WECHAT_APP_SECRET = ""
XUNHUPAY_GATEWAY = "https://api.xunhuweb.com/payment/do.html"
STATIC_SOURCE = "local"
STATIC_OUTPUT_DIR = "static-output"
GOOGLE_CLIENT_ID = "1070165774283-e75bs3en213p81iaq3g5dmpt15e6te9l.apps.googleusercontent.com"
GOOGLE_CLIENT_SECRET = "GOCSPX-oMHiR_wUYIe85DL0zWEii5Dee9I"
USD_WORKER_URL = "http://127.0.0.1:9788/mock-epusdt"
USD_API_AUTH_TOKEN = "test_token_for_local_dev_only_xyz"

# 定时触发器
[triggers]
crons = ["0 3 * * *", "0 4 * * *", "0 9 * * *", "0 21 * * *"]

# =====================================================
# 生产环境（wrangler deploy --env production）
# 用真实的远程 KV / D1 ID
# =====================================================

[env.production]
name = "cf-tv-service"

# 生产 KV
[[env.production.kv_namespaces]]
binding = "KV"
id = "d5e943d023d0474382b04b3c15c47ffb"

# 生产 D1
[[env.production.d1_databases]]
binding = "DB"
database_name = "tv-service-db"
database_id = "9c7c22f1-fa0e-48da-8874-19731483c550"

# Workers AI
[env.production.ai]
binding = "AI"

# 生产环境变量（可以覆盖默认）
[env.production.vars]
ADMIN_KEY = "admin-key-please-change-in-production"
TIMEZONE = "Asia/Shanghai"
RESEND_API_KEY = "re_SV65wtWn_6zDFiwGvPFRRv3gbcLDACDKe"
FROM_EMAIL = "support@iptv-search.com"
APP_URL = "https://iptv-search.com"
XUNHUPAY_ALIPAY_APP_ID = "202303140161"
XUNHUPAY_ALIPAY_APP_SECRET = "9265ede6d1d85a9ecb7cbf2b97ca0cbd"
XUNHUPAY_WECHAT_APP_ID = ""
XUNHUPAY_WECHAT_APP_SECRET = ""
XUNHUPAY_GATEWAY = "https://api.xunhuweb.com/payment/do.html"
STATIC_SOURCE = "local"
STATIC_OUTPUT_DIR = "static-output"
GOOGLE_CLIENT_ID = "1070165774283-e75bs3en213p81iaq3g5dmpt15e6te9l.apps.googleusercontent.com"
GOOGLE_CLIENT_SECRET = "GOCSPX-oMHiR_wUYIe85DL0zWEii5Dee9I"

# 生产 cron
[env.production.triggers]
crons = ["0 3 * * *", "0 4 * * *", "0 9 * * *", "0 21 * * *"]
