name = "cf-tv-service"
main = "worker.js"
compatibility_date = "2023-05-18"

# =====================================================
# 本地开发环境（wrangler dev 默认使用）
# KV / D1 用占位 ID，wrangler dev 会自动创建本地模拟器
# =====================================================

# 本地 KV 命名空间（占位 ID，本地模式自动建模拟器）
[[kv_namespaces]]
binding = "KV"
id = "local-kv-placeholder"
preview_id = "local-kv-placeholder"

# 本地 D1 数据库（占位 ID，本地模式自动建 SQLite）
[[d1_databases]]
binding = "DB"
database_name = "tv-service-db"
database_id = "local-d1-placeholder"

# Workers AI
[ai]
binding = "AI"

# 环境变量（生产密钥请通过 wrangler secret 或平台环境变量设置，勿在此硬编码）
[vars]
TIMEZONE = "Asia/Shanghai"
FROM_EMAIL = "support@iptv-search.com"
APP_URL = "https://iptv-search.com"
XUNHUPAY_GATEWAY = "https://api.xunhuweb.com/payment/do.html"
STATIC_SOURCE = "local"
STATIC_OUTPUT_DIR = "static-output"
USD_WORKER_URL = "http://127.0.0.1:9788"
USD_API_AUTH_TOKEN = "test_token_for_local_dev_only_xyz"

# 定时触发器
[triggers]
crons = ["0 3 * * *", "0 4 * * *", "0 9 * * *", "0 10 * * *", "0 21 * * *"]

# =====================================================
# 生产环境（wrangler deploy --env production）
# 用真实的远程 KV / D1 ID
# =====================================================

[env.production]
name = "cf-tv-service"

# 生产 KV
[[env.production.kv_namespaces]]
binding = "KV"
id = "d5e943d023d0474382b04b3c15c47ffb"

# 生产 D1
[[env.production.d1_databases]]
binding = "DB"
database_name = "tv-service-db"
database_id = "9c7c22f1-fa0e-48da-8874-19731483c550"

# Workers AI
[env.production.ai]
binding = "AI"

[env.production.vars]
TIMEZONE = "Asia/Shanghai"
FROM_EMAIL = "support@iptv-search.com"
APP_URL = "https://iptv-search.com"
XUNHUPAY_GATEWAY = "https://api.xunhuweb.com/payment/do.html"
STATIC_SOURCE = "local"
STATIC_OUTPUT_DIR = "static-output"
USD_WORKER_URL = "https://epusdt.iptv-search.com"  # ⚠️ 需要替换为实际 USDT Worker 地址
USD_API_AUTH_TOKEN = "fc8afe257db9841f2b25a52f7055ef417b06a00c36067a81000ceb6c2d5b2b9d"          # ⚠️ 需要替换为实际的认证 Token

# 以下敏感变量建议通过 Dashboard Secrets 或 wrangler secret put 设置：
# ADMIN_KEY, RESEND_API_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
# XUNHUPAY_ALIPAY_APP_ID, XUNHUPAY_ALIPAY_APP_SECRET

# 生产 cron
[env.production.triggers]
crons = ["0 3 * * *", "0 9 * * *", "0 10 * * *", "0 21 * * *"]
