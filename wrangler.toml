name = "cf-tv-service"
main = "worker.js"
compatibility_date = "2023-05-18"

# KV 命名空间
[[kv_namespaces]]
binding = "KV"
id = "d5e943d023d0474382b04b3c15c47ffb"
preview_id = "d5e943d023d0474382b04b3c15c47ffb"

# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "tv-service-db"
database_id = "9c7c22f1-fa0e-48da-8874-19731483c550"

# 环境变量
[vars]
# 在生产环境中应该设置为安全值
ADMIN_KEY = "admin-key-please-change-in-production"

# 定时触发器 (用于定时同步源数据)
[triggers]
crons = ["0 2 * * *"]  # 每天凌晨2点执行
