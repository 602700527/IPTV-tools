# 示例: "0 2 * * *" 表示每天凌晨2点执行
# "0 */6 * * *" 表示每6小时执行一次
# ⚠️ 已暂时禁用所有定时任务
[triggers]
crons = ["0 3 * * *", "0 9 * * *", "0 21 * * *"]  # 3:00同步数据源，9:00/21:00刷新缓存