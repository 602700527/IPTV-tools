<!--
  V3 Editorial Banner Template
  用于 cfworker2 项目的订阅横幅设计
-->

<style>
  /* V3 Editorial Banner Styles */
  .sub-value-banner {
    background: var(--bg-primary);
    border-top: 3px solid var(--accent);
    padding: 2.5rem 0;
    margin-top: 2rem;
  }
  
  .sub-value-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 2rem;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 3rem;
  }
  
  .sub-value-left {
    flex: 1;
  }
  
  .sub-value-eyebrow {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--accent);
    margin-bottom: 0.75rem;
  }
  
  .sub-value-title {
    font-size: 2.5rem;
    font-weight: 800;
    color: var(--text-primary);
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin: 0;
  }
  
  .sub-value-title span {
    color: var(--accent);
  }
  
  .sub-value-desc {
    font-size: 1rem;
    color: var(--text-secondary);
    margin-top: 1rem;
    max-width: 480px;
    line-height: 1.6;
  }
  
  .sub-value-url {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
  }
  
  .sub-value-url-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  
  .sub-value-url-code {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 0.9rem;
    color: var(--text-primary);
    font-weight: 500;
  }
  
  .sub-value-copy-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 0.8rem;
    padding: 0.375rem 0.75rem;
    transition: all 0.2s;
  }
  
  .sub-value-copy-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  
  .sub-value-player-hint {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 0.5rem;
  }
  
  .sub-value-cta {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem 2.5rem;
    background: var(--text-primary);
    color: var(--bg-primary);
    font-weight: 700;
    font-size: 1rem;
    text-decoration: none;
    transition: all 0.2s;
    white-space: nowrap;
    border: 2px solid var(--text-primary);
    flex-shrink: 0;
  }
  
  .sub-value-cta:hover {
    background: transparent;
    color: var(--text-primary);
  }
  
  @media (max-width: 768px) {
    .sub-value-inner {
      flex-direction: column;
      align-items: flex-start;
      gap: 2rem;
    }
    
    .sub-value-title {
      font-size: 1.75rem;
    }
    
    .sub-value-cta {
      width: 100%;
      justify-content: center;
    }
  }
</style>

<!-- Banner HTML -->
<div class="sub-value-banner">
  <div class="sub-value-inner">
    <div class="sub-value-left">
      <div class="sub-value-eyebrow">New User Special</div>
      <h2 class="sub-value-title">Your Full Channel<br><span>Playlist</span> Awaits</h2>
      <p class="sub-value-desc">Register now and get instant access to 5000+ IPTV channels. One click to your personal M3U subscription link.</p>
      <div class="sub-value-url">
        <span class="sub-value-url-label">Preview:</span>
        <span class="sub-value-url-code">https://iptv-search.com/sub/••••••••</span>
        <button class="sub-value-copy-btn" onclick="copySubUrl()">Copy Link</button>
      </div>
      <div class="sub-value-player-hint">VLC • APTV • TVBox • Tivimate • Televizo • GSE Smart IPTV • 途播</div>
    </div>
    <a href="/login#register" class="sub-value-cta">Get Free VIP →</a>
  </div>
</div>

<script>
  function copySubUrl() {
    const url = 'https://iptv-search.com/sub/••••••••';
    navigator.clipboard.writeText(url).then(() => {
      showToast('URL copied!');
    });
  }
</script>
