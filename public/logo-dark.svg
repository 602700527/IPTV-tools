<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="logoGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e50914;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- TV图标 - 带发光效果 -->
  <g transform="translate(10, 8)" filter="url(#glow)">
    <!-- 电视外框 -->
    <rect x="0" y="0" width="44" height="32" rx="4" fill="url(#logoGradientDark)" stroke="#e50914" stroke-width="1" />
    <!-- 屏幕内框 -->
    <rect x="4" y="4" width="36" height="24" rx="2" fill="#0a0a0a" />
    <!-- 播放按钮 - 更明显 -->
    <path d="M18 10 L30 16 L18 22 Z" fill="#fff" />
    <!-- 电视支架 -->
    <rect x="12" y="34" width="8" height="4" rx="1" fill="#555" />
    <rect x="24" y="34" width="8" height="4" rx="1" fill="#555" />
    <!-- 信号波 - 更多 -->
    <g stroke="#e50914" stroke-width="2" fill="none">
      <path d="M48 8 Q52 12 48 16" opacity="0.9" />
      <path d="M52 4 Q60 12 52 20" opacity="0.7" />
      <path d="M56 0 Q68 12 56 24" opacity="0.5" />
    </g>
  </g>
  
  <!-- 文字部分 - 带发光效果 -->
  <text x="65" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="800" fill="url(#logoGradientDark)" filter="url(#glow)">IPTV</text>
  <text x="65" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff" opacity="0.9">Search</text>
</svg>
