<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>连续签到功能测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #1a1a1a;
      color: #fff;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      margin-bottom: 20px;
      color: #e50914;
    }
    .section {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    h2 {
      margin-bottom: 15px;
      font-size: 18px;
      color: #60a5fa;
    }
    button {
      background: #e50914;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 10px;
      margin-bottom: 10px;
      transition: all 0.2s;
    }
    button:hover {
      background: #ff0f1f;
      transform: translateY(-2px);
    }
    button:disabled {
      background: #666;
      cursor: not-allowed;
      transform: none;
    }
    button.secondary {
      background: #60a5fa;
    }
    button.secondary:hover {
      background: #3b82f6;
    }
    .status {
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .status.success {
      background: rgba(34,197,94,0.2);
      border: 1px solid rgba(34,197,94,0.3);
      color: #4ade80;
    }
    .status.error {
      background: rgba(239,68,68,0.2);
      border: 1px solid rgba(239,68,68,0.3);
      color: #f87171;
    }
    .status.info {
      background: rgba(59,130,246,0.2);
      border: 1px solid rgba(59,130,246,0.3);
      color: #60a5fa;
    }
    .log {
      background: #0a0a0a;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
      max-height: 400px;
      overflow-y: auto;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 12px;
      line-height: 1.6;
    }
    .log-entry {
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .log-entry:last-child {
      border-bottom: none;
    }
    .log-time {
      color: #888;
      margin-right: 10px;
    }
    .log-success { color: #4ade80; }
    .log-error { color: #f87171; }
    .log-info { color: #60a5fa; }
    .data-display {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 15px;
      margin-top: 10px;
      font-size: 13px;
    }
    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .data-row:last-child {
      border-bottom: none;
    }
    .data-label {
      color: #888;
    }
    .data-value {
      color: #fff;
      font-weight: 500;
    }
    .test-case {
      margin-bottom: 15px;
      padding: 15px;
      background: #1a1a1a;
      border-radius: 8px;
      border-left: 3px solid #60a5fa;
    }
    .test-case.passed {
      border-left-color: #4ade80;
    }
    .test-case.failed {
      border-left-color: #f87171;
    }
    .test-case h3 {
      font-size: 14px;
      margin-bottom: 10px;
    }
    .test-case .result {
      font-size: 13px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h1>🧪 连续签到功能测试</h1>

  <div class="section">
    <h2>📋 测试信息</h2>
    <div class="status info">
      此测试工具用于验证连续签到功能的正确性，包括：
      <ul style="margin-left: 20px; margin-top: 10px;">
        <li>连续签到天数的统计逻辑</li>
        <li>中断后重新开始的计数</li>
        <li>连续签到奖励（7天、30天）</li>
        <li>提示信息是否正确显示</li>
      </ul>
    </div>
    <div style="margin-top: 15px;">
      <button onclick="startTest()">▶ 开始测试</button>
      <button onclick="resetTest()" class="secondary">🔄 重置测试</button>
      <button onclick="showSubscriptionInfo()" class="secondary">📊 查看当前状态</button>
    </div>
  </div>

  <div class="section">
    <h2>📝 测试结果</h2>
    <div id="testResults"></div>
  </div>

  <div class="section">
    <h2>📊 当前订阅状态</h2>
    <div id="subscriptionStatus" class="data-display">
      <div class="data-row">
        <span class="data-label">状态</span>
        <span class="data-value">未加载</span>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>📋 操作日志</h2>
    <div id="log" class="log">
      <div class="log-entry">
        <span class="log-time">--:--:--</span>
        <span class="log-info">准备就绪，点击"开始测试"按钮开始测试</span>
      </div>
    </div>
  </div>

  <script>
    let testResults = [];
    let subscriptionInfo = null;

    function log(message, type = 'info') {
      const logDiv = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML = `
        <span class="log-time">${time}</span>
        <span class="log-${type}">${message}</span>
      `;
      logDiv.insertBefore(entry, logDiv.firstChild);
    }

    function showTestResults() {
      const resultsDiv = document.getElementById('testResults');
      if (testResults.length === 0) {
        resultsDiv.innerHTML = '<div class="status info">暂无测试结果</div>';
        return;
      }

      let html = '';
      testResults.forEach(result => {
        const statusClass = result.passed ? 'passed' : 'failed';
        const statusIcon = result.passed ? '✅' : '❌';
        html += `
          <div class="test-case ${statusClass}">
            <h3>${statusIcon} ${result.name}</h3>
            <div class="result">${result.description}</div>
            ${result.details ? `<div style="margin-top: 8px; font-size: 12px; color: #888;">${result.details}</div>` : ''}
          </div>
        `;
      });
      resultsDiv.innerHTML = html;
    }

    function addTestResult(name, passed, description, details = '') {
      testResults.push({ name, passed, description, details });
      showTestResults();
      log(`${passed ? '✅ 通过' : '❌ 失败'}: ${name}`, passed ? 'success' : 'error');
    }

    async function getSubscriptionInfo() {
      try {
        const response = await fetch('/api/freesub/info');
        const data = await response.json();
        if (data.success) {
          subscriptionInfo = data;
          updateSubscriptionDisplay(data);
          return data;
        }
      } catch (error) {
        log('获取订阅信息失败: ' + error.message, 'error');
        return null;
      }
    }

    function updateSubscriptionDisplay(data) {
      const statusDiv = document.getElementById('subscriptionStatus');
      statusDiv.innerHTML = `
        <div class="data-row">
          <span class="data-label">订阅ID</span>
          <span class="data-value">${data.sub_id || 'N/A'}</span>
        </div>
        <div class="data-row">
          <span class="data-label">过期时间</span>
          <span class="data-value">${data.expired_at ? new Date(data.expired_at).toLocaleString() : 'N/A'}</span>
        </div>
        <div class="data-row">
          <span class="data-label">连续签到</span>
          <span class="data-value">${data.consecutive_days || 0}天</span>
        </div>
        <div class="data-row">
          <span class="data-label">总签到天数</span>
          <span class="data-value">${data.total_days || 0}天</span>
        </div>
        <div class="data-row">
          <span class="data-label">最后签到</span>
          <span class="data-value">${data.last_checkin ? new Date(data.last_checkin).toLocaleString() : '从未签到'}</span>
        </div>
      `;
    }

    async function performCheckIn() {
      try {
        const response = await fetch('/api/freesub/checkin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        const data = await response.json();
        return data;
      } catch (error) {
        log('签到请求失败: ' + error.message, 'error');
        return { success: false, error: error.message };
      }
    }

    async function startTest() {
      log('========== 开始测试连续签到功能 ==========', 'info');
      testResults = [];

      // 获取初始状态
      log('步骤1: 获取初始订阅状态', 'info');
      const initialInfo = await getSubscriptionInfo();
      if (!initialInfo) {
        log('❌ 无法获取订阅信息，请确保已创建订阅', 'error');
        return;
      }

      const initialConsecutiveDays = initialInfo.consecutive_days || 0;
      log(`初始连续签到天数: ${initialConsecutiveDays}天`, 'info');

      // 测试1: 验证提示信息正确性
      log('测试1: 验证签到提示信息', 'info');
      const checkInResult = await performCheckIn();
      if (checkInResult.success) {
        const { rewardDays, consecutiveDays, isConsecutive, message } = checkInResult;

        // 检查提示信息格式
        const hasConsecutiveInfo = message.includes('连续签到');
        const hasRewardInfo = message.includes('获得') && message.includes('天');

        // 连续签到时的提示
        if (isConsecutive) {
          const correctFormat = message === `连续签到${consecutiveDays}天，获得${rewardDays}天！`;
          addTestResult(
            '连续签到提示信息',
            correctFormat,
            `连续签到${consecutiveDays}天时的提示`,
            `实际提示: "${message}"${correctFormat ? '' : ' (格式错误)'}`
          );
        } else {
          const correctFormat = message === `签到成功，获得${rewardDays}天！`;
          addTestResult(
            '首次/重新签到提示信息',
            correctFormat,
            `非连续签到时的提示`,
            `实际提示: "${message}"${correctFormat ? '' : ' (格式错误)'}`
          );
        }

        // 检查返回值一致性
        const consecutiveDaysInMessage = parseInt(message.match(/连续签到(\d+)天/)?.[1] || 0);
        const rewardDaysInMessage = parseInt(message.match(/获得(\d+)天/)?.[1] || 0);

        addTestResult(
          '返回值与提示一致性',
          consecutiveDays === consecutiveDaysInMessage && rewardDays === rewardDaysInMessage,
          `返回值连续${consecutiveDays}天/奖励${rewardDays}天，提示中为${consecutiveDaysInMessage}天/${rewardDaysInMessage}天`,
          `message: "${message}"`
        );

      } else if (checkInResult.reason === 'already_checked_in') {
        addTestResult(
          '重复签到检测',
          true,
          '正确检测到今日已签到',
          `reason: ${checkInResult.reason}`
        );
      } else {
        addTestResult(
          '签到功能',
          false,
          '签到失败',
          `reason: ${checkInResult.reason || checkInResult.error}`
        );
      }

      // 更新状态
      await getSubscriptionInfo();

      // 测试2: 检查连续签到统计是否正确
      if (initialInfo.consecutive_days !== undefined) {
        const currentInfo = await getSubscriptionInfo();
        const currentConsecutiveDays = currentInfo.consecutive_days || 0;

        if (checkInResult.success && checkInResult.isConsecutive) {
          // 如果是连续签到，应该比初始值+1
          const expectedDays = initialConsecutiveDays + 1;
          addTestResult(
            '连续签到统计',
            currentConsecutiveDays === expectedDays,
            `连续签到天数从${initialConsecutiveDays}天更新为${currentConsecutiveDays}天`,
            `期望: ${expectedDays}天, 实际: ${currentConsecutiveDays}天`
          );
        } else if (checkInResult.success && !checkInResult.isConsecutive) {
          // 如果不是连续签到，应该重置为1
          addTestResult(
            '中断后重置统计',
            currentConsecutiveDays === 1,
            `中断后连续签到天数重置为${currentConsecutiveDays}天`,
            `期望: 1天, 实际: ${currentConsecutiveDays}天`
          );
        }
      }

      // 测试3: 检查奖励规则
      if (checkInResult.success) {
        const { consecutiveDays, rewardDays } = checkInResult;
        let expectedReward = 1;

        if (consecutiveDays >= 30) {
          expectedReward = 7;
        } else if (consecutiveDays >= 7) {
          expectedReward = 2;
        }

        addTestResult(
          '签到奖励规则',
          rewardDays === expectedReward,
          `${consecutiveDays}天连续签到获得${rewardDays}天奖励`,
          `期望: ${expectedReward}天`
        );
      }

      // 测试4: 检查提示语是否正确
      if (checkInResult.success && checkInResult.message) {
        const message = checkInResult.message;
        const correctPhrases = ['连续签到', '获得', '天', '！'];
        const allCorrect = correctPhrases.every(phrase => message.includes(phrase));

        addTestResult(
          '提示语格式',
          allCorrect,
          '提示语包含必要的关键词',
          `提示语: "${message}"`
        );
      }

      log('========== 测试完成 ==========', 'info');
      log(`✅ 共执行 ${testResults.length} 个测试，通过 ${testResults.filter(r => r.passed).length} 个`, 'info');
    }

    async function resetTest() {
      testResults = [];
      document.getElementById('testResults').innerHTML = '<div class="status info">测试已重置，点击"开始测试"按钮重新开始</div>';
      log('========== 测试已重置 ==========', 'info');
      await getSubscriptionInfo();
    }

    async function showSubscriptionInfo() {
      await getSubscriptionInfo();
    }

    // 页面加载时获取订阅信息
    window.onload = function() {
      getSubscriptionInfo();
    };
  </script>
</body>
</html>
