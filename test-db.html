<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>D1 数据库测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-result {
            margin: 20px 0;
            padding: 15px;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .info {
            background-color: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        button {
            padding: 10px 20px;
            margin: 10px 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button.primary {
            background-color: #007bff;
            color: white;
        }
        button:hover {
            opacity: 0.8;
        }
        pre {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔍 D1 数据库测试</h1>

    <div id="status" class="test-result info">
        点击下方按钮开始测试...
    </div>

    <button class="primary" onclick="testD1()">测试 D1 连接</button>
    <button onclick="testSearch()">测试搜索功能</button>
    <button onclick="testSync()">测试同步功能</button>

    <div id="results"></div>

    <script>
        const API_BASE = '/api';

        async function testD1() {
            showStatus('正在测试 D1 连接...', 'info');

            try {
                // 测试数据库是否可用
                const response = await fetch('/api/test/db');

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const result = await response.json();

                if (result.success) {
                    showStatus('✓ D1 数据库连接成功', 'success');
                    addResult('D1 连接测试', JSON.stringify(result, null, 2), true);
                } else {
                    throw new Error(result.error || '未知错误');
                }
            } catch (error) {
                showStatus(`✗ D1 连接失败: ${error.message}`, 'error');
                addResult('D1 连接测试', error.message, false);
            }
        }

        async function testSearch() {
            showStatus('正在测试搜索功能...', 'info');

            try {
                const response = await fetch('/api/channels?search=test');

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const result = await response.json();

                if (result.success !== false) {
                    showStatus('✓ 搜索功能正常', 'success');
                    addResult('搜索功能测试', `找到 ${result.results?.length || 0} 个频道`, true);
                } else {
                    throw new Error(result.error || '未知错误');
                }
            } catch (error) {
                showStatus(`✗ 搜索功能失败: ${error.message}`, 'error');
                addResult('搜索功能测试', error.message, false);
            }
        }

        async function testSync() {
            showStatus('正在测试同步功能（需要管理员权限）...', 'info');

            try {
                const adminKey = prompt('请输入管理员密钥:');
                if (!adminKey) {
                    showStatus('✗ 已取消测试', 'info');
                    return;
                }

                const response = await fetch('/api/sync/all', {
                    method: 'POST',
                    headers: {
                        'X-Admin-Key': adminKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({})
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const result = await response.json();

                if (result.success) {
                    showStatus('✓ 同步功能正常', 'success');
                    addResult('同步功能测试', result.message, true);
                } else {
                    throw new Error(result.error || '未知错误');
                }
            } catch (error) {
                showStatus(`✗ 同步功能失败: ${error.message}`, 'error');
                addResult('同步功能测试', error.message, false);
            }
        }

        function showStatus(message, type) {
            document.getElementById('status').className = `test-result ${type}`;
            document.getElementById('status').textContent = message;
        }

        function addResult(title, content, success) {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${success ? 'success' : 'error'}`;
            resultDiv.innerHTML = `
                <h3>${title}</h3>
                <pre>${content}</pre>
            `;
            resultsDiv.appendChild(resultDiv);
        }
    </script>
</body>
</html>
